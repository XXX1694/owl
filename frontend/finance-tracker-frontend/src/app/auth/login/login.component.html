<mat-card style="max-width: 400px; margin: 100px auto; padding: 20px">
  <h2 mat-card-title>Вход в систему</h2>

  <form
    (ngSubmit)="onLogin()"
    style="display: flex; flex-direction: column; gap: 16px"
  >
    <mat-form-field appearance="outline">
      <mat-label>Имя пользователя</mat-label>
      <input matInput [(ngModel)]="username" name="username" required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Пароль</mat-label>
      <input
        matInput
        [(ngModel)]="password"
        name="password"
        type="password"
        required
      />
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit">Войти</button>
    <a mat-button routerLink="/register">Нет аккаунта? Зарегистрируйтесь</a>
  </form>

  <mat-error *ngIf="error">{{ error }}</mat-error>
</mat-card>
